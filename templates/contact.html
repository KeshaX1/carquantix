<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact - CarQuantix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="about-page">
  <main class="about-wrap">
    <section class="about-card">
      <h1>Contact</h1>
      <p>You can reach the CarQuantix team for support, partnerships, or product questions.</p>
      <ul>
        <li>Email: <a href="mailto:carquantix@gmail.com">carquantix@gmail.com</a></li>
        <li>Website: <a href="/" rel="noopener noreferrer">CarQuantix platform</a></li>
      </ul>
      <h2>Social</h2>
      <div class="contact-social" aria-label="Social links">
        <a class="social-link facebook" href="https://www.facebook.com/CarQuantix" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a class="social-link instagram" href="https://www.instagram.com/CarQuantix" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a class="social-link tiktok" href="https://www.tiktok.com/@carquantix" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>
      <p>We usually respond within 1-2 business days.</p>
    </section>
  </main>
</body>
</html>
