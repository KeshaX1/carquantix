<header class="topbar site-topbar">
  <div class="brand-block">
    <a class="brand-name" href="/">CarQuantix</a>
    <span class="brand-copy">&copy; 2026</span>
  </div>
  <nav class="top-links" aria-label="Top links">
    <a href="/" class="top-link" data-i18n="navHome">Home</a>
    <a href="/news" class="top-link" data-i18n="navNews">News</a>
    <a href="/guides" class="top-link" data-i18n="navGuides">Guides</a>
    <a href="/blog" class="top-link" data-i18n="navBlog">Blog</a>
    <a href="/pricing" class="top-link" data-i18n="navPricing">Pricing</a>
  </nav>
  <div class="auth-area">
    <div class="switch-row top-switch">
      <button class="theme-icon-toggle is-dark" type="button" data-site-theme-toggle aria-pressed="true" aria-label="Switch to light mode" title="Switch to light mode">
        <svg class="theme-sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/><path d="M17.5 4.5v3M16 6h3"/></svg>
      </button>
    </div>
    <select class="topbar-lang-select" aria-label="Language selector" data-site-lang-select>
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
    {% if user %}
    <a class="auth-btn" href="/" data-i18n="account">Account</a>
    {% else %}
    <button class="auth-btn" type="button" data-site-login-open data-i18n="login">Log In</button>
    {% endif %}
  </div>
</header>

{% if not user %}
<div class="site-login-modal" data-site-login-modal aria-hidden="true" hidden>
  <button class="site-login-backdrop" type="button" data-site-login-close aria-label="Close"></button>
  <section class="site-login-dialog" role="dialog" aria-modal="true" aria-labelledby="siteLoginTitle">
    <button class="site-login-close" type="button" data-site-login-close aria-label="Close">&times;</button>
    <div class="site-login-media">
      <img src="/static/icon/hero.jpg" alt="A dark sports car with blue illuminated gauges" width="1920" height="1080" decoding="async">
    </div>
    <div class="site-login-body">
    <h2 id="siteLoginTitle" data-site-auth-copy="title">Log In</h2>
    <form class="site-login-form" data-site-login-form>
      <label class="site-login-label" for="siteLoginEmail" data-site-auth-copy="email">Email</label>
      <input id="siteLoginEmail" class="site-login-input" type="email" placeholder="Email" autocomplete="email" required data-site-login-email>
      <label class="site-login-label" for="siteLoginPassword" data-site-auth-copy="password">Password</label>
      <div class="site-login-password-row">
        <input id="siteLoginPassword" class="site-login-input" type="password" placeholder="Password" autocomplete="current-password" minlength="8" required data-site-login-password>
        <button class="site-login-password-toggle" type="button" data-site-password-toggle aria-label="Show password" title="Show password">
          <svg class="site-eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
          <svg class="site-eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="site-login-error" data-site-login-error role="alert" aria-live="polite" hidden></div>
      <div class="site-login-strength"><span data-site-password-strength>Password strength: -</span><span>Min 8 characters, mix letters/numbers.</span></div>
      <a class="site-login-forgot" href="/?auth=reset">Forgot your password?</a>
      <button class="site-login-submit" type="submit" data-site-auth-copy="submit">Log In</button>
    </form>
    <a class="site-login-google" href="/login/google" data-site-google-login data-site-auth-copy="google">Continue with Google</a>
    <p class="site-login-create">Don't have an account? <a href="/?auth=register">Create one</a></p>
    </div>
  </section>
</div>
{% endif %}

<style>
  .site-login-modal[hidden] { display: none !important; }
  .site-login-modal {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .site-login-backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: rgba(0, 0, 0, 0.72);
    cursor: default;
  }
  .site-login-dialog {
    position: relative;
    z-index: 1;
    width: min(760px, calc(100vw - 40px));
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    background: #1d1f24;
    color: #f8fafc;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
  }
  .site-login-media { height:230px; overflow:hidden; background:#000; }
  .site-login-media img { display:block; width:100%; height:100%; object-fit:cover; }
  .site-login-body { padding:30px; }
  .site-login-dialog h2 {
    margin: 0 42px 22px 0;
    font-size: 1.55rem;
  }
  .site-login-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    color: inherit;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
  }
  .site-login-form { display: grid; gap: 10px; }
  .site-login-label { font-size: 0.86rem; font-weight: 800; }
  .site-login-input {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    border: 1px solid #4b5563;
    border-radius: 9px;
    background: #111318;
    color: #f8fafc;
    font: inherit;
  }
  .site-login-password-row { display: flex; align-items: stretch; gap: 8px; }
  .site-login-password-row .site-login-input { min-width: 0; flex: 1; }
  .site-login-password-toggle {
    flex: 0 0 46px;
    border: 1px solid #4b5563;
    border-radius: 9px;
    background: #111827;
    color: #f8fafc;
    cursor: pointer;
  }
  .site-login-password-toggle svg { width:18px; height:18px; display:block; margin:auto; }
  .site-login-password-toggle .site-eye-closed { display:none; }
  .site-login-password-toggle.is-showing .site-eye-open { display:none; }
  .site-login-password-toggle.is-showing .site-eye-closed { display:block; }
  .site-login-error {
    padding: 9px 10px;
    border: 1px solid rgba(239, 68, 68, 0.5);
    border-radius: 9px;
    background: rgba(127, 29, 29, 0.3);
    color: #fecaca;
    font-size: 0.84rem;
    font-weight: 700;
  }
  .site-login-strength { display:flex; justify-content:space-between; gap:12px; color:#8b8f98; font-size:.76rem; }
  .site-login-strength-weak { color:#ef4444; font-weight:700; }
  .site-login-strength-medium { color:#f59e0b; font-weight:700; }
  .site-login-strength-strong { color:#22c55e; font-weight:700; }
  .site-login-forgot, .site-login-create a { color:inherit; }
  .site-login-forgot { width:fit-content; margin:4px 0; font-size:1rem; }
  .site-login-create { margin:22px 0 0; }
  .site-login-submit,
  .site-login-google {
    min-height: 44px;
    border: 0;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    font: inherit;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .site-login-submit {
    margin-top: 6px;
    background: linear-gradient(135deg, #078cff, #12c9ff);
    color: #06101d;
  }
  .site-login-google {
    width: 100%;
    margin-top: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: #f8fafc;
  }
  body.site-login-modal-open { overflow: hidden !important; }
  body:not(.dark) .site-login-dialog {
    border-color: rgba(15, 23, 42, 0.12);
    background: #ffffff;
    color: #0f172a;
  }
  body:not(.dark) .site-login-close,
  body:not(.dark) .site-login-password-toggle {
    border-color: #cbd5e1;
    background: #f8fafc;
    color: #0f172a;
  }
  body:not(.dark) .site-login-input {
    border-color: #cbd5e1;
    background: #ffffff;
    color: #0f172a;
  }
  body:not(.dark) .site-login-google {
    border-color: #cbd5e1;
    background: #f8fafc;
    color: #0f172a;
  }
  @media (max-width: 760px) {
    .site-topbar { padding-right: 170px; }
    .site-topbar .top-links {
      padding-left: 10px;
      gap: 10px;
    }
    .site-topbar .top-link { font-size: 12px; }
    .site-login-modal { padding: 14px; }
    .site-login-dialog {
      width: min(340px, calc(100vw - 28px));
      max-height: calc(100dvh - 28px);
      padding:0;
    }
    .site-login-media { height:clamp(150px,26dvh,210px); }
    .site-login-body { padding:18px 16px 20px; }
    .site-login-dialog h2 { font-size: 1.35rem; }
    .site-login-label { display:none; }
    .site-login-input { min-height:42px; }
    .site-login-strength { font-size:.62rem; }
  }
</style>

<script>
(() => {
  const topbar = document.querySelector('.site-topbar');
  const themeToggle = document.querySelector('[data-site-theme-toggle]');
  const langSelect = document.querySelector('[data-site-lang-select]');
  const loginOpen = document.querySelector('[data-site-login-open]');
  const loginModal = document.querySelector('[data-site-login-modal]');
  const loginForm = document.querySelector('[data-site-login-form]');
  const emailInput = document.querySelector('[data-site-login-email]');
  const passwordInput = document.querySelector('[data-site-login-password]');
  const passwordToggle = document.querySelector('[data-site-password-toggle]');
  const passwordStrength = document.querySelector('[data-site-password-strength]');
  const loginError = document.querySelector('[data-site-login-error]');
  const googleLogin = document.querySelector('[data-site-google-login]');

  const COPY = {
    en: { darkMode: 'Dark Mode', navHome: 'Home', navNews: 'News', navGuides: 'Guides', navBlog: 'Blog', navPricing: 'Pricing', login: 'Log In', account: 'Account', title: 'Log In', email: 'Email', password: 'Password', submit: 'Log In', google: 'Continue with Google', showPassword: 'Show password', hidePassword: 'Hide password', strength: 'Password strength', weak: 'weak', medium: 'medium', strong: 'strong', required: 'Email and password are required.', invalid: 'Invalid email or password.', generic: 'Something went wrong. Please try again.', close: 'Close' },
    tr: { darkMode: 'Karanlık Mod', navHome: 'Ana Sayfa', navNews: 'Haberler', navGuides: 'Rehberler', navBlog: 'Blog', navPricing: 'Fiyatlandırma', login: 'Giriş Yap', account: 'Hesabım', title: 'Giriş Yap', email: 'E-posta', password: 'Parola', submit: 'Giriş Yap', google: 'Google ile devam et', showPassword: 'Parolayı göster', hidePassword: 'Parolayı gizle', required: 'E-posta ve parola gereklidir.', invalid: 'E-posta veya parola hatalı.', generic: 'Bir hata oluştu. Lütfen tekrar deneyin.', close: 'Kapat' },
    de: { darkMode: 'Dunkelmodus', navHome: 'Startseite', navNews: 'Neuigkeiten', navGuides: 'Ratgeber', navBlog: 'Blog', navPricing: 'Preise', login: 'Anmelden', account: 'Konto', title: 'Anmelden', email: 'E-Mail', password: 'Passwort', submit: 'Anmelden', google: 'Mit Google fortfahren', showPassword: 'Passwort anzeigen', hidePassword: 'Passwort ausblenden', required: 'E-Mail und Passwort sind erforderlich.', invalid: 'E-Mail oder Passwort ist falsch.', generic: 'Ein Fehler ist aufgetreten. Bitte erneut versuchen.', close: 'Schließen' },
    fr: { darkMode: 'Mode sombre', navHome: 'Accueil', navNews: 'Actualités', navGuides: 'Guides', navBlog: 'Blog', navPricing: 'Tarifs', login: 'Connexion', account: 'Compte', title: 'Connexion', email: 'E-mail', password: 'Mot de passe', submit: 'Connexion', google: 'Continuer avec Google', showPassword: 'Afficher le mot de passe', hidePassword: 'Masquer le mot de passe', required: "L'e-mail et le mot de passe sont obligatoires.", invalid: 'E-mail ou mot de passe incorrect.', generic: 'Une erreur est survenue. Réessayez.', close: 'Fermer' },
    es: { darkMode: 'Modo oscuro', navHome: 'Inicio', navNews: 'Noticias', navGuides: 'Guías', navBlog: 'Blog', navPricing: 'Precios', login: 'Iniciar sesión', account: 'Cuenta', title: 'Iniciar sesión', email: 'Correo electrónico', password: 'Contraseña', submit: 'Iniciar sesión', google: 'Continuar con Google', showPassword: 'Mostrar contraseña', hidePassword: 'Ocultar contraseña', required: 'El correo y la contraseña son obligatorios.', invalid: 'El correo o la contraseña no son válidos.', generic: 'Se produjo un error. Inténtalo de nuevo.', close: 'Cerrar' },
    ru: { darkMode: 'Тёмный режим', navHome: 'Главная', navNews: 'Новости', navGuides: 'Руководства', navBlog: 'Блог', navPricing: 'Цены', login: 'Войти', account: 'Аккаунт', title: 'Войти', email: 'Электронная почта', password: 'Пароль', submit: 'Войти', google: 'Продолжить с Google', showPassword: 'Показать пароль', hidePassword: 'Скрыть пароль', required: 'Необходимо ввести электронную почту и пароль.', invalid: 'Неверная электронная почта или пароль.', generic: 'Произошла ошибка. Повторите попытку.', close: 'Закрыть' },
  };

  let currentLang = (localStorage.getItem('appLang') || 'en').toLowerCase();
  if (!COPY[currentLang]) currentLang = 'en';

  const getCopy = () => COPY[currentLang] || COPY.en;
  const updatePasswordToggle = () => {
    if (!passwordToggle || !passwordInput) return;
    const label = getCopy()[passwordInput.type === 'text' ? 'hidePassword' : 'showPassword'];
    passwordToggle.setAttribute('aria-label', label);
    passwordToggle.title = label;
    passwordToggle.classList.toggle('is-showing', passwordInput.type === 'text');
  };
  const computePasswordStrength = (password) => {
    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
    if (/\d/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;
    if (password.length >= 12) score++;
    return score >= 4 ? 'strong' : score >= 2 ? 'medium' : 'weak';
  };
  const updatePasswordStrength = () => {
    if (!passwordStrength || !passwordInput) return;
    const password = passwordInput.value;
    const strength = password ? computePasswordStrength(password) : '';
    passwordStrength.classList.remove('site-login-strength-weak', 'site-login-strength-medium', 'site-login-strength-strong');
    passwordStrength.textContent = `${getCopy().strength || COPY.en.strength}: ${strength ? (getCopy()[strength] || strength) : '-'}`;
    if (strength) passwordStrength.classList.add(`site-login-strength-${strength}`);
  };
  const applyCopy = () => {
    const copy = getCopy();
    topbar?.querySelectorAll('[data-i18n]').forEach((element) => {
      const key = element.getAttribute('data-i18n');
      if (copy[key]) element.textContent = copy[key];
    });
    loginModal?.querySelectorAll('[data-site-auth-copy]').forEach((element) => {
      const key = element.getAttribute('data-site-auth-copy');
      if (copy[key]) element.textContent = copy[key];
    });
    if (emailInput) emailInput.placeholder = copy.email;
    if (passwordInput) passwordInput.placeholder = copy.password;
    loginModal?.querySelectorAll('[data-site-login-close]').forEach((element) => {
      element.setAttribute('aria-label', copy.close);
    });
    if (langSelect) langSelect.value = currentLang;
    document.documentElement.lang = currentLang;
    updatePasswordToggle();
    updatePasswordStrength();
  };

  const storedTheme = localStorage.getItem('theme');
  const defaultDark = storedTheme ? storedTheme === 'dark' : true;
  const syncTheme = (next) => {
    document.body.classList.toggle('dark', next);
    if (themeToggle) {
      themeToggle.classList.toggle('is-dark', next);
      themeToggle.setAttribute('aria-pressed', String(next));
      const label = next ? 'Switch to light mode' : 'Switch to dark mode';
      themeToggle.setAttribute('aria-label', label);
      themeToggle.title = label;
    }
    localStorage.setItem('theme', next ? 'dark' : 'light');
  };
  syncTheme(defaultDark);
  if (themeToggle) {
    themeToggle.addEventListener('click', () => syncTheme(!document.body.classList.contains('dark')));
  }
  if (langSelect) {
    langSelect.addEventListener('change', () => {
      currentLang = COPY[langSelect.value] ? langSelect.value : 'en';
      localStorage.setItem('appLang', currentLang);
      applyCopy();
      window.location.reload();
    });
  }

  const openLogin = () => {
    if (!loginModal) return;
    loginModal.hidden = false;
    loginModal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('site-login-modal-open');
    if (loginError) loginError.hidden = true;
    applyCopy();
    window.setTimeout(() => emailInput?.focus(), 0);
  };
  const closeLogin = () => {
    if (!loginModal) return;
    loginModal.hidden = true;
    loginModal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('site-login-modal-open');
    loginOpen?.focus();
  };

  loginOpen?.addEventListener('click', openLogin);
  loginModal?.querySelectorAll('[data-site-login-close]').forEach((element) => {
    element.addEventListener('click', closeLogin);
  });
  if (window.location.hash === '#login') {
    openLogin();
    window.history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
  }
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && loginModal && !loginModal.hidden) closeLogin();
  });
  passwordToggle?.addEventListener('click', () => {
    if (!passwordInput) return;
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    updatePasswordToggle();
  });
  passwordInput?.addEventListener('input', updatePasswordStrength);

  if (googleLogin) {
    const next = `${window.location.pathname}${window.location.search}${window.location.hash}`;
    googleLogin.href = `/login/google?next=${encodeURIComponent(next)}`;
  }

  loginForm?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const copy = getCopy();
    const email = (emailInput?.value || '').trim();
    const password = passwordInput?.value || '';
    if (!email || !password) {
      if (loginError) {
        loginError.textContent = copy.required;
        loginError.hidden = false;
      }
      return;
    }
    const submit = loginForm.querySelector('[type="submit"]');
    if (submit) submit.disabled = true;
    if (loginError) loginError.hidden = true;
    try {
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        if (loginError) {
          loginError.textContent = data.message === 'Invalid email or password.' ? copy.invalid : data.message === 'Email and password are required.' ? copy.required : copy.generic;
          loginError.hidden = false;
        }
        return;
      }
      window.location.reload();
    } catch (error) {
      if (loginError) {
        loginError.textContent = copy.generic;
        loginError.hidden = false;
      }
    } finally {
      if (submit) submit.disabled = false;
    }
  });

  applyCopy();
})();
</script>
